name: Bug Report
description: Report a crash, ABI mismatch, rendering artifact, or regression in ScarletBridge.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please only include unencrypted homebrew, SDK samples, or custom PE32+ test binaries — never attach copyrighted commercial game files.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact command (`SB_LOG=debug scarletbridge run ...`) and binary/harness used.
      placeholder: |
        1. Build with `cargo build ...`
        2. Run `SB_LOG=debug ./target/debug/scarletbridge run ...`
        3. Observe crash / output
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant `SB_LOG` output / Vulkan validation logs
      description: Paste traces (try `SB_LOG=debug` and `SB_VK_VALIDATION=1` for GPU issues).
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Linux distro & kernel:
        - GPU & Vulkan driver (e.g., AMD RX 5700 XT / Mesa RADV 25.x):
        - Rust version (`rustc --version`):
    validations:
      required: true
